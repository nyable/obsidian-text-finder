strictPeerDependencies: true
saveExact: true
tagVersionPrefix: ''

# CodeMirror classes must come from one version, including transitive imports.
# Keep these aligned with the pinned Obsidian SDK's peer dependencies.
overrides:
  '@codemirror/state': 6.7.6
  '@codemirror/view': 6.43.13

allowBuilds:
  '@parcel/watcher': true
  esbuild: true

# Exact recent releases selected for the dependency upgrade, not a wildcard bypass.
minimumReleaseAgeExclude:
  - sass@1.106.1
  - vite@8.3.5
  - i18next@26.5.4
